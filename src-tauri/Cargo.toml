[package]
name = "dayflow"
version = "0.1.0"
description = "A gentle local task planner"
authors = ["Dayflow"]
edition = "2021"

[lib]
name = "dayflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dayflow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

